<aside class="statistics">
  <h1 class="visually-hidden">Statistics</h1>

  <dl class="statistics-table">
    <dt>
      <img class="statistics-key" src="static/earth.svg" alt="Countries visited" />
    </dt>
    <dd class="statistics-value">{{ statistics.number_of_countries_visited }}</dd>

    {% for mode_of_transport, total_distance_km in statistics.total_distance_km_by_mode_of_transport.items() %}
      {% if total_distance_km > 0 %}
        <dt>
          <img class="statistics-key" src="static/modes/{{ mode_of_transport }}.svg" alt="By {{ mode_of_transport }}" />
        </dt>
        <dd class="statistics-value">{{ total_distance_km }}&nbsp;km</dd>
      {% endif %}
    {% endfor %}
  </dl>
</aside>
